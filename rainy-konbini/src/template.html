<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:," />
  <title>雨夜の街角 ─ 星見マート</title>
  <style>
    :root {
      color-scheme: dark;
      background: #050912;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, #101e34 0%, #080e1b 44%, #04070d 100%);
    }
    #scene {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
      touch-action: none;
      cursor: grab;
    }
    #scene:active {
      cursor: grabbing;
    }
    ::selection {
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="雨の夜のコンビニ街角ジオラマ"></canvas>
  <!--APP-->
</body>
</html>
